{% extends "base.html" %}
{% block title %}Notes{% endblock %}
{% block content %}
<div class="card">
    <h2>📝 Notes</h2>
    {% if notes %}
    <table>
        <tr><th>ID</th><th>Title</th><th>Actions</th></tr>
        {% for n in notes %}
        <tr>
            <td>{{ n.id }}</td>
            <td><a href="{{ url_for('note_detail', note_id=n.id) }}">{{ n.title }}</a></td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>No notes.</p>
    {% endif %}
</div>
{% endblock %}
